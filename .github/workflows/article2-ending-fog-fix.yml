name: Fix Article 2 ending fog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/article2-ending-fog-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove ending section from global reveal treatment
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/picasso-seen-with-fresh-eyes/page.module.css')
          text = path.read_text()
          old = '.ending{width:min(1180px,calc(100vw - 5rem));margin:0 auto;padding:clamp(3rem,4vw,4rem) 0;border-top:1px solid rgba(17,17,15,.22);display:flex;align-items:flex-end;justify-content:space-between;gap:3rem}'
          new = '.ending{width:min(1180px,calc(100vw - 5rem));margin:0 auto;padding:clamp(3rem,4vw,4rem) 0;border-top:1px solid rgba(17,17,15,.22);display:flex;align-items:flex-end;justify-content:space-between;gap:3rem;animation:none!important;opacity:1!important;transform:none!important;clip-path:none!important}'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one ending rule, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit surgical fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/picasso-seen-with-fresh-eyes/page.module.css
          git commit -m 'Keep Article 2 ending section fully opaque'
          git push
      - name: Remove one-off workflow
        run: |
          git pull --rebase
          git rm .github/workflows/article2-ending-fog-fix.yml
          git commit -m 'Remove one-off Article 2 ending fog fix'
          git push

name: Finalize EASTOKYO footer credit

on:
  push:
    paths:
      - '.github/workflows/footer-credit-final.yml'

permissions:
  contents: write

jobs:
  update-footer-credit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update only footer creator credit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/eastokyo/SiteChrome.tsx')
          s = p.read_text()
          old = '<p className="mag-creator-credit">EASTOKYO · CREATED BY JAMES SIMMONS · WORDS &amp; PHOTOGRAPHY BY THÉO DELACROIX.</p>'
          new = '<p className="mag-creator-credit"><span>FOUNDER &amp; EDITOR: JAMES SIMMONS</span><br /><span>WORDS &amp; PHOTOGRAPHY BY THÉO DELACROIX.</span></p>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old footer credit, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify exact credit
        run: |
          grep -F 'FOUNDER &amp; EDITOR: JAMES SIMMONS' app/eastokyo/SiteChrome.tsx
          grep -F 'WORDS &amp; PHOTOGRAPHY BY THÉO DELACROIX.' app/eastokyo/SiteChrome.tsx
          ! grep -F 'EASTOKYO · CREATED BY JAMES SIMMONS · WORDS &amp; PHOTOGRAPHY BY THÉO DELACROIX.' app/eastokyo/SiteChrome.tsx
      - name: Commit footer credit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/eastokyo/SiteChrome.tsx
          git commit -m 'Set founder editor and creative credits' || exit 0
          git push
      - name: Remove one-off workflow
        run: |
          git pull --rebase
          git rm .github/workflows/footer-credit-final.yml
          git commit -m 'Remove one-off footer credit formatter'
          git push

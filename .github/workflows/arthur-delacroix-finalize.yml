name: One-off Arthur Delacroix credit finalizer

on:
  push:
    paths:
      - '.github/workflows/arthur-delacroix-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize EASTOKYO pen-name credits
        run: |
          python - <<'PY'
          from pathlib import Path

          asagaya = Path('app/the-city-puts-on-a-costume/page.tsx')
          text = asagaya.read_text(encoding='utf-8')
          old = 'BY ARTHUR DELACROIX<br/>(ALIAS ARTHUR DELACROIX)'
          if old in text:
              text = text.replace(old, 'BY ARTHUR DELACROIX')
              asagaya.write_text(text, encoding='utf-8')

          index_page = Path('app/nothing-is-just-what-it-is/page.tsx')
          text = index_page.read_text(encoding='utf-8')
          old_hero = '<p className={styles.deck}>We start with one thing and end up somewhere else. That’s half the pleasure.</p></div><div className={styles.heroNote}>'
          new_hero = '<p className={styles.deck}>We start with one thing and end up somewhere else. That’s half the pleasure.</p><p className={styles.byline}>BY ARTHUR DELACROIX<br/>EASTOKYO · ISSUE 01</p></div><div className={styles.heroNote}>'
          if old_hero not in text and 'BY ARTHUR DELACROIX' not in text:
              raise SystemExit('Could not locate Article 05 hero insertion point.')
          text = text.replace(old_hero, new_hero)
          index_page.write_text(text, encoding='utf-8')

          css = Path('app/nothing-is-just-what-it-is/page.module.css')
          css_text = css.read_text(encoding='utf-8')
          rule = '.byline{margin:.9rem 0 0;font-size:.62rem;font-weight:750;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.84)}'
          if '.byline{' not in css_text:
              marker = '@media(max-width:1080px)'
              if marker not in css_text:
                  raise SystemExit('Could not locate Article 05 responsive CSS marker.')
              css_text = css_text.replace(marker, rule + marker, 1)
              css.write_text(css_text, encoding='utf-8')

          article_pages = [
              Path('app/he-never-really-left-the-arena/page.tsx'),
              Path('app/picasso-seen-with-fresh-eyes/page.tsx'),
              Path('app/when-one-point-of-view-wasnt-enough/page.tsx'),
              Path('app/the-city-puts-on-a-costume/page.tsx'),
              Path('app/nothing-is-just-what-it-is/page.tsx'),
          ]
          missing = [str(p) for p in article_pages if 'ARTHUR DELACROIX' not in p.read_text(encoding='utf-8')]
          if missing:
              raise SystemExit('Arthur Delacroix missing from article pages: ' + ', '.join(missing))

          old_names = ['JAMES SIMMONS', 'James Simmons', 'JIMICHANGA', 'Jimichanga']
          leftovers = []
          for root in [Path('app'), Path('public')]:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.ts','.tsx','.js','.jsx','.css','.md','.html','.json','.txt','.xml'}:
                      continue
                  try:
                      data = p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if any(name in data for name in old_names):
                      leftovers.append(str(p))
          if leftovers:
              raise SystemExit('Old public-facing names remain in: ' + ', '.join(leftovers))

          print('All five article pages identify the author as Arthur Delacroix; old public-facing names are absent from app/public text files.')
          PY

      - name: Remove one-off workflow
        run: rm .github/workflows/arthur-delacroix-finalize.yml

      - name: Commit final credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app public .github/workflows/arthur-delacroix-finalize.yml
          git commit -m "Finalize Arthur Delacroix author credits"
          git push

name: EASTOKYO metadata fix

on:
  push:
    paths:
      - ".github/workflows/eastokyo-metadata-fix.yml"

permissions:
  contents: write

jobs:
  fix-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch article metadata only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
            "app/he-never-really-left-the-arena/page.tsx": '''export const metadata: Metadata = {
            title: "Il est toujours retourné dans l'arène.",
            description: "Picasso et l'arène qu'il n'a jamais vraiment quittée.",
            alternates: { canonical: "/he-never-really-left-the-arena" },
            robots: { index: true, follow: true, googleBot: { index: true, follow: true } },
            openGraph: {
              title: "Il est toujours retourné dans l'arène.",
              description: "Picasso et l'arène qu'il n'a jamais vraiment quittée.",
              url: "/he-never-really-left-the-arena",
              siteName: "EASTOKYO",
              locale: "fr_FR",
              type: "article",
              images: [{ url: "/images/editorial/picasso-bullfight-01-desktop.png", alt: "Il est toujours retourné dans l'arène." }],
            },
            twitter: {
              card: "summary_large_image",
              title: "Il est toujours retourné dans l'arène.",
              description: "Picasso et l'arène qu'il n'a jamais vraiment quittée.",
              images: ["/images/editorial/picasso-bullfight-01-desktop.png"],
            },
          };''',
            "app/picasso-seen-with-fresh-eyes/page.tsx": '''export const metadata: Metadata = {
            title: "Picasso, sous un autre regard",
            description: "Picasso vu par Paul Smith au National Art Center, Tokyo.",
            alternates: { canonical: "/picasso-seen-with-fresh-eyes" },
            robots: { index: true, follow: true, googleBot: { index: true, follow: true } },
            openGraph: {
              title: "Picasso, sous un autre regard",
              description: "Picasso vu par Paul Smith au National Art Center, Tokyo.",
              url: "/picasso-seen-with-fresh-eyes",
              siteName: "EASTOKYO",
              locale: "fr_FR",
              type: "article",
              images: [{ url: "/images/editorial/picasso-man-in-blue-hero-desktop.png", alt: "Picasso, sous un autre regard" }],
            },
            twitter: {
              card: "summary_large_image",
              title: "Picasso, sous un autre regard",
              description: "Picasso vu par Paul Smith au National Art Center, Tokyo.",
              images: ["/images/editorial/picasso-man-in-blue-hero-desktop.png"],
            },
          };''',
            "app/when-one-point-of-view-wasnt-enough/page.tsx": '''export const metadata: Metadata = {
            title: "Quand un seul angle ne suffisait plus.",
            description: "Picasso, Braque, le cubisme et le moment où un seul point de vue fixe ne suffisait plus.",
            alternates: { canonical: "/when-one-point-of-view-wasnt-enough" },
            robots: { index: true, follow: true, googleBot: { index: true, follow: true } },
            openGraph: {
              title: "Quand un seul angle ne suffisait plus.",
              description: "Picasso, Braque, le cubisme et le moment où un seul point de vue fixe ne suffisait plus.",
              url: "/when-one-point-of-view-wasnt-enough",
              siteName: "EASTOKYO",
              locale: "fr_FR",
              type: "article",
              images: [{ url: "/images/editorial/cubism-orange-portrait-hero-desktop.png", alt: "Quand un seul angle ne suffisait plus." }],
            },
            twitter: {
              card: "summary_large_image",
              title: "Quand un seul angle ne suffisait plus.",
              description: "Picasso, Braque, le cubisme et le moment où un seul point de vue fixe ne suffisait plus.",
              images: ["/images/editorial/cubism-orange-portrait-hero-desktop.png"],
            },
          };''',
            "app/the-city-puts-on-a-costume/page.tsx": '''export const metadata: Metadata = {
            title: "La ville se déguise.",
            description: "Le Tanabata d'Asagaya, quand une rue commerçante ordinaire de Tokyo décide de devenir autre chose pendant quelques nuits d'été.",
            alternates: { canonical: "/the-city-puts-on-a-costume" },
            robots: { index: true, follow: true, googleBot: { index: true, follow: true } },
            openGraph: {
              title: "La ville se déguise.",
              description: "Le Tanabata d'Asagaya, quand une rue commerçante ordinaire de Tokyo décide de devenir autre chose pendant quelques nuits d'été.",
              url: "/the-city-puts-on-a-costume",
              siteName: "EASTOKYO",
              locale: "fr_FR",
              type: "article",
              images: [{ url: "/images/editorial/asagaya-hero-01-desktop.jpg", alt: "La ville se déguise." }],
            },
            twitter: {
              card: "summary_large_image",
              title: "La ville se déguise.",
              description: "Le Tanabata d'Asagaya, quand une rue commerçante ordinaire de Tokyo décide de devenir autre chose pendant quelques nuits d'été.",
              images: ["/images/editorial/asagaya-hero-01-desktop.jpg"],
            },
          };''',
            "app/nothing-is-just-what-it-is/page.tsx": '''export const metadata: Metadata = {
            title: "Rien n’est jamais tout à fait ce qu’on croit.",
            description: "Picasso, objets, portraits, rayures, céramiques, et le plaisir de partir d’un truc pour finir ailleurs.",
            alternates: { canonical: "/nothing-is-just-what-it-is" },
            robots: { index: true, follow: true, googleBot: { index: true, follow: true } },
            openGraph: {
              title: "Rien n’est jamais tout à fait ce qu’on croit.",
              description: "Picasso, objets, portraits, rayures, céramiques, et le plaisir de partir d’un truc pour finir ailleurs.",
              url: "/nothing-is-just-what-it-is",
              siteName: "EASTOKYO",
              locale: "fr_FR",
              type: "article",
              images: [{ url: "/images/editorial/index-hero-desktop.jpg", alt: "Rien n’est jamais tout à fait ce qu’on croit." }],
            },
            twitter: {
              card: "summary_large_image",
              title: "Rien n’est jamais tout à fait ce qu’on croit.",
              description: "Picasso, objets, portraits, rayures, céramiques, et le plaisir de partir d’un truc pour finir ailleurs.",
              images: ["/images/editorial/index-hero-desktop.jpg"],
            },
          };''',
          }

          for filename, replacement in replacements.items():
              path = Path(filename)
              text = path.read_text()
              pattern = r"export const metadata: Metadata\s*=\s*\{.*?\n\};" if "the-city-puts-on-a-costume" not in filename else r"export const metadata: Metadata=\{.*?\};"
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Metadata block not replaced exactly once in {filename}: {count}")
              path.write_text(updated)
          PY

      - name: Commit metadata fixes
        run: |
          git diff --check
          git config user.name "EASTOKYO maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add app/he-never-really-left-the-arena/page.tsx app/picasso-seen-with-fresh-eyes/page.tsx app/when-one-point-of-view-wasnt-enough/page.tsx app/the-city-puts-on-a-costume/page.tsx app/nothing-is-just-what-it-is/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix article indexing and social metadata"
          git push origin HEAD:main

name: Théo Delacroix identity migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/theo-delacroix-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Arthur credits and add creator recognition
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          text_exts = {'.tsx', '.ts', '.jsx', '.js', '.css', '.md', '.json', '.html', '.txt'}
          changed = []
          replacements = {
              'ARTHUR DELACROIX': 'THÉO DELACROIX',
              'Arthur Delacroix': 'Théo Delacroix',
          }

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.next' in path.parts or 'node_modules' in path.parts:
                  continue
              if path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          chrome = Path('app/eastokyo/SiteChrome.tsx')
          text = chrome.read_text(encoding='utf-8')
          creator = '        <p className="mag-creator-credit">EASTOKYO · CREATED BY THÉO DELACROIX · WORDS &amp; PHOTOGRAPHY BY THÉO DELACROIX.</p>\n'
          anchor = '        <Link className="mag-footer-wordmark" href="/" aria-label="EASTOKYO home">EASTOKYO</Link>\n'
          if 'mag-creator-credit' not in text:
              if anchor not in text:
                  raise SystemExit('Could not find footer wordmark anchor for creator credit')
              text = text.replace(anchor, creator + anchor, 1)
              chrome.write_text(text, encoding='utf-8')
              changed.append(str(chrome))

          css = Path('app/eastokyo/site-shell-final.css')
          css_text = css.read_text(encoding='utf-8')
          if '.mag-creator-credit' not in css_text:
              css_text += '''\n\n/* EASTOKYO creator signature */\n.mag-site-chrome .mag-creator-credit {\n  margin: 1rem 0 .25rem !important;\n  color: rgba(247, 241, 231, .82) !important;\n  font-size: .58rem !important;\n  font-weight: 800 !important;\n  line-height: 1.35 !important;\n  letter-spacing: .12em !important;\n  text-transform: uppercase !important;\n}\n@media (max-width: 899px) {\n  .mag-site-chrome .mag-creator-credit {\n    margin: .8rem 0 .15rem !important;\n    font-size: .5rem !important;\n    line-height: 1.4 !important;\n    letter-spacing: .1em !important;\n  }\n}\n'''
              css.write_text(css_text, encoding='utf-8')
              changed.append(str(css))

          article_pages = [
              Path('app/he-never-really-left-the-arena/page.tsx'),
              Path('app/picasso-seen-with-fresh-eyes/page.tsx'),
              Path('app/when-one-point-of-view-wasnt-enough/page.tsx'),
              Path('app/the-city-puts-on-a-costume/page.tsx'),
              Path('app/nothing-is-just-what-it-is/page.tsx'),
          ]
          for page in article_pages:
              body = page.read_text(encoding='utf-8')
              if 'THÉO DELACROIX' not in body:
                  raise SystemExit(f'Missing Théo Delacroix credit in {page}')
              if 'ARTHUR DELACROIX' in body or 'Arthur Delacroix' in body:
                  raise SystemExit(f'Old Arthur Delacroix credit remains in {page}')

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              if path.suffix.lower() not in text_exts:
                  continue
              try:
                  body = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'ARTHUR DELACROIX' in body or 'Arthur Delacroix' in body:
                  raise SystemExit(f'Old Arthur Delacroix identity remains in {path}')

          print('Changed files:')
          for item in sorted(set(changed)):
              print(item)
          PY
      - name: Remove one-off workflow
        run: rm .github/workflows/theo-delacroix-migration.yml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Make Théo Delacroix the EASTOKYO creator credit'
          git push

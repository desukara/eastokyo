name: One-off visible Arthur Delacroix credit pass

on:
  push:
    paths:
      - '.github/workflows/arthur-delacroix-visible-credits.yml'

permissions:
  contents: write

jobs:
  credit-pass:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make author and photographer credits explicit on every article
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'app/he-never-really-left-the-arena/page.tsx': (
              'BY ARTHUR DELACROIX',
              'WORDS & PHOTOGRAPHY: ARTHUR DELACROIX'
            ),
            'app/picasso-seen-with-fresh-eyes/page.tsx': (
              'BY ARTHUR DELACROIX<br/>EASTOKYO · ISSUE 01',
              'WORDS & PHOTOGRAPHY: ARTHUR DELACROIX<br/>EASTOKYO · ISSUE 01'
            ),
            'app/when-one-point-of-view-wasnt-enough/page.tsx': (
              'BY ARTHUR DELACROIX<br/>EASTOKYO · ISSUE 01',
              'WORDS & PHOTOGRAPHY: ARTHUR DELACROIX<br/>EASTOKYO · ISSUE 01'
            ),
            'app/the-city-puts-on-a-costume/page.tsx': (
              '<span>BY ARTHUR DELACROIX</span>',
              '<span>WORDS & PHOTOGRAPHY: ARTHUR DELACROIX</span>'
            ),
            'app/nothing-is-just-what-it-is/page.tsx': (
              'BY ARTHUR DELACROIX<br/>EASTOKYO · ISSUE 01',
              'WORDS & PHOTOGRAPHY: ARTHUR DELACROIX<br/>EASTOKYO · ISSUE 01'
            ),
          }

          for filename, (old, new) in replacements.items():
            p = Path(filename)
            text = p.read_text(encoding='utf-8')
            if new in text:
              continue
            if old not in text:
              raise SystemExit(f'Expected credit not found in {filename}')
            text = text.replace(old, new, 1)
            p.write_text(text, encoding='utf-8')

          for filename in replacements:
            text = Path(filename).read_text(encoding='utf-8')
            if 'WORDS & PHOTOGRAPHY: ARTHUR DELACROIX' not in text:
              raise SystemExit(f'Explicit author/photographer credit missing from {filename}')

          print('Verified: all five article pages visibly credit WORDS & PHOTOGRAPHY: ARTHUR DELACROIX.')
          PY

      - name: Remove one-off workflow
        run: rm .github/workflows/arthur-delacroix-visible-credits.yml

      - name: Commit visible credit pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/arthur-delacroix-visible-credits.yml
          git commit -m "Make Arthur Delacroix credits explicit on every article"
          git push
